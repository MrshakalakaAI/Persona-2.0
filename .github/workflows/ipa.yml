name: Build and verify personaж
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Sources/**", "Resources/**", "Tests/**", "UITests/**", "Scripts/**", "project.yml", ".github/workflows/**"]
permissions:
  contents: write
concurrency:
  group: personazh-release
  cancel-in-progress: true
jobs:
  build:
    # Standard runner, public repository; no larger runners, caches or billed artifact storage.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project PersonaFree.xcodeproj -scheme PersonaFree -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Run processing and export tests on simulator
        timeout-minutes: 28
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if "iPhone" in v["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project PersonaFree.xcodeproj -scheme PersonaFree -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath test-build -resultBundlePath TestResults.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test 2>&1 | tee tests.log
          xcrun simctl install "$DEVICE" test-build/Build/Products/Debug-iphonesimulator/PersonaFree.app
          xcrun simctl launch --terminate-running-process "$DEVICE" com.personafree.editor --ui-test-photo
          sleep 3
          xcrun simctl io "$DEVICE" screenshot simulator.png
          ditto -c -k --keepParent TestResults.xcresult TestResults.zip
      - name: Package and verify IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PersonaFree.app Payload/
          test ! -d Payload/PersonaFree.app/_CodeSignature
          zip -qr personazh-unsigned.ipa Payload
          python3 Scripts/verify_ipa.py personazh-unsigned.ipa | tee verification.json
          shasum -a 256 personazh-unsigned.ipa > personazh-unsigned.ipa.sha256
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" personazh-unsigned.ipa personazh-unsigned.ipa.sha256 verification.json build.log tests.log simulator.png TestResults.zip --target "$GITHUB_SHA" --title "personaж — проверенная unsigned-сборка $GITHUB_RUN_NUMBER" --notes "Автоматическая сборка и тесты завершены. IPA требует подписи собственным сертификатом. Ограничения и функции: README.md. Реальный iPhone не тестировался."
