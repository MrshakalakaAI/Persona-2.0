name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app
        run: |
          xcodebuild -project PersonaFree.xcodeproj -scheme PersonaFree -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PersonaFree.app Payload/
          zip -qr PersonaFree-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PersonaFree-unsigned-IPA
          path: PersonaFree-unsigned.ipa
